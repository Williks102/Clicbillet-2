# Maintenance planifiée de ClicBillet.
#
# Deux routes de l'application doivent être appelées périodiquement. Sans elles, rien ne casse
# visiblement — et c'est précisément le problème :
#
#   - les places retenues par des paniers jamais payés ne sont jamais rendues, donc un
#     événement affiche complet alors qu'il reste des places à vendre ;
#   - les e-mails qui n'ont pas pu partir du premier coup restent en file indéfiniment, donc
#     le billet payé n'arrive jamais dans la boîte de l'acheteur.
#
# Vercel Cron n'est pas utilisable ici : le compte partage son quota de tâches planifiées avec
# une autre application, et en ajouter une fait échouer le déploiement (cf. .env.example).
#
# Les exécutions planifiées de GitHub Actions peuvent être décalées de plusieurs minutes aux
# heures chargées. C'est sans conséquence ici : la rétention des paniers est de 30 minutes et
# le drainage des e-mails n'est pas sensible à la minute. Si un déclenchement à l'heure juste
# devient nécessaire, un service dédié comme cron-job.org appelle les mêmes URL.
#
# GitHub désactive les workflows planifiés après 60 jours sans activité sur le dépôt, avec un
# e-mail d'avertissement. Sur un dépôt actif, la question ne se pose pas.
#
# Deux secrets à créer dans Settings > Secrets and variables > Actions :
#   CRON_SECRET  — la même valeur que la variable d'environnement du même nom sur Vercel
#   APP_ORIGIN   — l'origine publique, sans barre finale (ex : https://www.clicbillet.com)

name: Maintenance planifiée

on:
  schedule:
    - cron: "*/10 * * * *"
  # Permet de déclencher à la main depuis l'onglet Actions, pour tester le réglage sans
  # attendre le prochain créneau.
  workflow_dispatch:

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Expiration des paniers abandonnés et purges
        run: |
          code=$(curl -s -o /tmp/reponse.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_ORIGIN }}/api/cron/expire-pending-tickets")
          echo "HTTP $code"
          cat /tmp/reponse.json
          echo
          # Un échec doit être VISIBLE : sans ce test, le workflow resterait vert alors que la
          # route renvoie 401 ou 500, et personne ne s'apercevrait que rien ne tourne.
          test "$code" = "200"

      - name: Drainage de la file d'e-mails
        # Toujours exécuté, même si l'étape précédente a échoué : les deux tâches sont
        # indépendantes, et un billet payé qui attend son e-mail ne doit pas dépendre du bon
        # déroulement d'une purge.
        if: always()
        run: |
          code=$(curl -s -o /tmp/reponse.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_ORIGIN }}/api/cron/drain-emails")
          echo "HTTP $code"
          cat /tmp/reponse.json
          echo
          test "$code" = "200"
