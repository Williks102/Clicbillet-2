name: Android APK (debug)

on:
  push:
    branches: [ccr-66ac8c03-0jbl6q]
    paths: ["mobile/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run lint
      - run: npx expo prebuild --platform android --no-install
        env:
          EXPO_PUBLIC_API_URL: https://www.clicbillet.com
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: clicbillet-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
